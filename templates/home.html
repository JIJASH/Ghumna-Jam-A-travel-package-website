<!-- templates/home.html -->
{% comment %} {% extends 'base.html' %}

{% block content %}
<h1>Welcome to the Travel Package Website</h1>
{% if user.is_authenticated %}
    <p>Hello, {{ user.username }}!</p>
{% else %}
    <p>Please <a href="{% url 'login' %}">login</a> or <a href="{% url 'register' %}">register</a> to continue.</p>
{% endif %}
{% endblock %} {% endcomment %}
