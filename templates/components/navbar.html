{% load static %}
<nav class="nav container">
    <!-- Brand Logo -->
    <a href="{% url 'home' %}" class="nav__logo">
        <img src="{% static 'img/logo.png' %}" alt="Ghumna Jam!" width="40" height="40" class="d-inline-block align-text-top">        Ghumna Jam!
    </a>

    <!-- Hamburger Menu for Mobile -->
    <div class="nav__menu" id="nav-menu">
        <ul class="nav__list">
            <!-- Navigation Links -->
            <li class="nav__item">
                <a href="{% url 'home' %}" class="nav__link active-link">Home</a>
            </li>
            <li class="nav__item">
                <a href="{% url 'discover' %}" class="nav__link">Discover</a>
            </li>
            <li class="nav__item">
                <a href="{% url 'contact' %}" class="nav__link">Contact</a>
            </li>
            <li class="nav__item">
                <a href="{% url 'about' %}" class="nav__link">About</a>
            </li>
        </ul>

        <!-- Authentication Links -->
        <ul class="nav__list ms-auto">
            {% if user.is_authenticated %}
                <li class="nav__item">
                    <a href="{% url 'logout' %}" class="nav__link">Logout</a>
                </li>
            {% else %}
                <li class="nav__item">
                    <a href="{% url 'login' %}" class="nav__link">Login</a>
                </li>
                <li class="nav__item">
                    <a href="{% url 'signup' %}" class="nav__link">Sign Up</a>
                </li>
            {% endif %}
        </ul>

        <!-- Theme Change Button -->
        <div class="nav__dark">
            <span class="change-theme-name">Dark mode</span>
            <i class="ri-moon-line change-theme" id="theme-button"></i>
        </div>

        <!-- Close Button for Mobile Menu -->
        <i class="ri-close-line nav__close" id="nav-close"></i>
    </div>

    <!-- Hamburger Toggle for Mobile -->
    <div class="nav__toggle" id="nav-toggle">
        <i class="ri-function-line"></i>
    </div>
</nav>
