<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-6 rounded-lg shadow-lg max-w-md w-full text-center">
        <h1 class="text-2xl font-bold text-red-600 mb-4">Payment Failed</h1>
        <p class="text-gray-700 mb-4">There was an issue with your payment. Please try again.</p>
        {% if booking %}
            <a href="{% url 'travel_app:payment' booking_id=booking.id %}" class="mt-6 inline-block bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700 transition duration-200">Try Again</a>
        {% endif %}
        <a href="{% url 'travel_app:home' %}" class="mt-4 inline-block text-blue-600 hover:underline">Return to Home</a>
    </div>
</body>
</html>
